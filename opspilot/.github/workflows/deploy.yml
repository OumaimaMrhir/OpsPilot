name: Deploy to Azure

# Déclenchement manuel. Prérequis : `terraform apply` effectué, et secrets AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID configurés pour une connexion OIDC (sans mot de passe).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acropspilot
  RESOURCE_GROUP: rg-opspilot
  APP_NAME: ca-opspilot-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build et push de l'image dans Azure Container Registry
        run: az acr build --registry "$ACR_NAME" --image "opspilot:${{ github.sha }}" --image opspilot:latest .
      - name: Mise à jour de la Container App
        run: |
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/opspilot:${{ github.sha }}"
