[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "Mini-plateforme AIOps : détection d'anomalies, incidents ServiceNow, triage IA et remédiation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2.7", "httpx>=0.27", "pyyaml>=6.0"]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "pandas>=2.2"]
dev = ["pytest>=8", "ruff>=0.6", "python-hcl2>=4.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

